<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESMT Automation Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF5F00; --orange-dim: #cc4c00; --dark: #0d0d0f; --panel: #141418;
      --border: rgba(255,255,255,0.07); --text: #e8e8ec; --muted: #6b6b7a;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card { background: var(--panel); border: 1px solid var(--border); padding: 2.5rem; border-radius: 12px; width: 380px; text-align: center; }
    h2 { font-family: 'Space Mono', monospace; color: var(--orange); margin-bottom: 1.5rem; }
    select, input { width: 100%; padding: 0.8rem; background: #1a1a20; border: 1px solid var(--border); color: white; border-radius: 6px; margin-bottom: 1rem; }
    .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; background: var(--orange); color: white; transition: 0.2s; }
    .btn:hover { background: var(--orange-dim); }
    label { display: block; text-align: left; margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>ESMT LOGIN</h2>
    <div style="margin-bottom: 1.5rem;">
      <label>Región</label>
      <select id="region">
        <option value="mypurecloud.com">Americas (US East)</option>
        <option value="usw2.pure.cloud">Americas (US West)</option>
      </select>
    </div>
    <div style="margin-bottom: 1.5rem;">
      <label>Client ID (CISA)</label>
      <input type="text" id="clientId" value="8782f09d-0b70-4966-993d-88b9016e4544" readonly>
    </div>
    <button class="btn" onclick="login()">Ingresar</button>
  </div>

  <script>
    function login() {
      const region = document.getElementById('region').value;
      const clientId = document.getElementById('clientId').value;
      const redirectUri = window.location.origin + window.location.pathname.replace('index.html', 'auth-callback.html');
      
      sessionStorage.setItem('gc_region', region);
      
      const authUrl = `https://login.${region}/oauth/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}`;
      window.location.href = authUrl;
    }
  </script>
</body>
</html>
