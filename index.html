<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESMT Automation Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF5F00; --orange-dim: #cc4c00; --dark: #0d0d0f; --panel: #141418;
      --border: rgba(255,255,255,0.07); --text: #e8e8ec; --muted: #6b6b7a; --green: #00e5a0;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card { background: var(--panel); border: 1px solid var(--border); padding: 2rem; border-radius: 12px; width: 400px; }
    h2 { font-family: 'Space Mono', monospace; color: var(--orange); margin-bottom: 1.5rem; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--muted); }
    input, select { width: 100%; padding: 0.75rem; background: #1a1a20; border: 1px solid var(--border); color: white; border-radius: 6px; }
    .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 1rem; transition: 0.2s; }
    .btn-primary { background: var(--orange); color: white; }
    .btn-secondary { background: transparent; border: 1px solid var(--orange); color: var(--orange); }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .error-msg { color: #ff4f4f; font-size: 0.85rem; margin-top: 1rem; display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>ESMT LOGIN</h2>
    
    <div class="form-group">
      <label>Región de Genesys Cloud</label>
      <select id="region">
        <option value="mypurecloud.com">Americas (US East)</option>
        <option value="usw2.pure.cloud">Americas (US West)</option>
        <option value="cac1.pure.cloud">Americas (Canada)</option>
        <option value="mypurecloud.ie">Europe (Ireland)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Client ID</label>
      <input type="text" id="clientId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    </div>

    <div class="form-group">
      <label>Client Secret (Solo para modo Credentials)</label>
      <input type="password" id="clientSecret" placeholder="••••••••••••••••••••">
    </div>

    <button class="btn btn-primary" onclick="loginCISA()">Ingresar modo CISA (Implicit)</button>
    <button class="btn btn-secondary" onclick="loginWithCredentials()">Ingresar con Client Credentials</button>
    
    <div id="errorBox" class="error-msg"></div>
  </div>

  <script>
    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    // Tu login original de CISA
    function loginCISA() {
      const region = document.getElementById('region').value;
      const clientId = "8782f09d-0b70-4966-993d-88b9016e4544"; // Tu ID de CISA
      sessionStorage.setItem('gc_region', region);
      window.location.href = `https://login.${region}/oauth/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(window.location.origin + window.location.pathname.replace('index.html', 'auth-callback.html'))}`;
    }

    // Nuevo login para cualquier Org
    async function loginWithCredentials() {
      const region = document.getElementById('region').value;
      const clientId = document.getElementById('clientId').value;
      const clientSecret = document.getElementById('clientSecret').value;

      if (!clientId || !clientSecret) {
        showError('Debes ingresar Client ID y Secret');
        return;
      }

      try {
        const response = await fetch('http://127.0.0.1:3000/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ region, clientId, clientSecret })
        });

        const data = await response.json();

        if (data.access_token) {
          sessionStorage.setItem('gc_token', data.access_token);
          sessionStorage.setItem('gc_region', region);
          sessionStorage.setItem('gc_method', 'credentials');
          window.location.href = 'app.html';
        } else {
          showError('Error: ' + (data.error || 'Credenciales inválidas'));
        }
      } catch (err) {
        showError('No se pudo conectar al servidor local (server.js). Verifica que esté corriendo.');
      }
    }
  </script>
</body>
</html>
