<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESMT Automation Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF5F00;
      --orange-dim: #cc4c00;
      --dark: #0d0d0f;
      --panel: #141418;
      --border: rgba(255,255,255,0.07);
      --text: #e8e8ec;
      --muted: #6b6b7a;
      --green: #00e5a0;
      --input-bg: #1a1a20;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Fondo decorativo sutil */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,95,0,0.15) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      right: -100px;
      z-index: 1;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,95,0,0.08) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      left: -150px;
      z-index: 1;
    }

    .login-container {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      z-index: 2;
      backdrop-filter: blur(10px);
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand h1 {
      font-family: 'Space Mono', monospace;
      font-size: 1.8rem;
      color: var(--orange);
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input, select {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,95,0,0.15);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      margin-top: 0.75rem;
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }

    .btn-primary:hover {
      background: var(--orange-dim);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.15);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-box {
      background: rgba(255, 79, 79, 0.1);
      border: 1px solid rgba(255, 79, 79, 0.2);
      color: #ff4f4f;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 1rem;
      display: none;
      text-align: center;
      line-height: 1.4;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand">
      <h1>⚡ ESMT SUITE</h1>
      <p>Automation & Tools Center</p>
    </div>

    <div class="form-group">
      <label for="region">Región Genesys Cloud</label>
      <select id="region">
        <option value="mypurecloud.com">Americas (US East - mypurecloud.com)</option>
        <option value="usw2.pure.cloud">Americas (US West - usw2.pure.cloud)</option>
        <option value="cac1.pure.cloud">Americas (Canada - cac1.pure.cloud)</option>
        <option value="mypurecloud.ie">Europe (Ireland - mypurecloud.ie)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="implicitClientId">Client ID (OAuth)</label>
      <input type="text" id="implicitClientId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    </div>

    <div class="form-group" id="secretGroup">
      <label for="clientSecret">Client Secret (Solo para Credentials)</label>
      <input type="password" id="clientSecret" placeholder="••••••••••••••••••••••••••••••••">
    </div>

    <button class="btn btn-primary" id="btnLoginCISA" onclick="loginCISA()">
      Ingresar modo CISA (Implicit)
    </button>

    <div class="divider">ó de forma externa</div>

    <button class="btn btn-secondary" id="btnCredentials" onclick="loginWithCredentials()">
      Conectar vía Client Credentials
    </button>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function clearError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    // ─── LOGIN 1: IMPLICIT (CISA) ───────────────────────────────────────────
    function loginCISA() {
      clearError();
      const region = document.getElementById('region').value;
      // Usamos el ID de CISA por defecto si el campo está vacío, o el ingresado por el usuario
      let clientId = document.getElementById('implicitClientId').value.trim();
      
      if (!clientId) {
        clientId = "8782f09d-0b70-4966-993d-88b9016e4544"; // ID predeterminado de CISA
      }

      sessionStorage.setItem('gc_region', region);
      sessionStorage.setItem('gc_method', 'implicit');
      localStorage.setItem('gc_saved_client_id', clientId);
      localStorage.setItem('gc_saved_region', region);

      const redirectUri = window.location.origin + window.location.pathname.replace('index.html', 'auth-callback.html');
      window.location.href = `https://login.${region}/oauth/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}`;
    }

    // ─── LOGIN 2: CLIENT CREDENTIALS (Cualquier Org) ────────────────────────
    async function loginWithCredentials() {
      clearError();
      const region = document.getElementById('region').value;
      const clientId = document.getElementById('implicitClientId').value.trim();
      const clientSecret = document.getElementById('clientSecret').value.trim();

      if (!clientId || !clientSecret) {
        showError('Para este método debes ingresar el Client ID y el Client Secret.');
        return;
      }

      const btn = document.getElementById('btnCredentials');
      const originalText = btn.textContent;
      btn.textContent = 'Solicitando token local...';
      btn.disabled = true;

      try {
        // Apuntamos a localhost en el puerto 3000
        const response = await fetch('http://localhost:3000/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ region, clientId, clientSecret })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Error de autenticación en Genesys');
        }

        const data = await response.json();

        if (data.access_token) {
          sessionStorage.setItem('gc_token', data.access_token);
          sessionStorage.setItem('gc_region', region);
          sessionStorage.setItem('gc_method', 'credentials');
          
          localStorage.setItem('gc_saved_client_id', clientId);
          localStorage.setItem('gc_saved_region', region);

          window.location.href = 'app.html';
        } else {
          showError('No se recibió un token válido.');
        }

      } catch (err) {
        console.error(err);
        showError('No se pudo conectar con tu backend local. Asegúrate de iniciar "server.js" y de permitir contenido no seguro en tu navegador.');
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    // Restaurar campos guardados al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      const savedClientId = localStorage.getItem('gc_saved_client_id') || sessionStorage.getItem('gc_client_id');
      const savedRegion   = localStorage.getItem('gc_saved_region') || sessionStorage.getItem('gc_region');

      if (savedClientId) {
        document.getElementById('implicitClientId').value = savedClientId;
      }
      if (savedRegion) {
        document.getElementById('region').value = savedRegion;
      }
    });
  </script>
</body>
</html>
