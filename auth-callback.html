<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticando... · ESMT Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF5F00;
      --dark: #0d0d0f;
      --panel: #141418;
      --border: rgba(255,255,255,0.07);
      --text: #e8e8ec;
      --muted: #6b6b7a;
      --green: #00e5a0;
      --red: #ff4f4f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(0,229,160,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      text-align: center;
      padding: 20px;
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-wrap.loading {
      background: rgba(255,95,0,0.1);
      border: 2px solid rgba(255,95,0,0.2);
    }

    .icon-wrap.success {
      background: rgba(0,229,160,0.1);
      border: 2px solid rgba(0,229,160,0.3);
    }

    .icon-wrap.error {
      background: rgba(255,79,79,0.1);
      border: 2px solid rgba(255,79,79,0.3);
    }

    /* Spinner de carga */
    .spinner-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--orange);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-title {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .status-desc {
      font-size: 14px;
      color: var(--muted);
      max-width: 300px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Log de progreso */
    .log {
      margin-top: 28px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      text-align: left;
      max-width: 400px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      line-height: 2;
      min-height: 80px;
    }

    .log .ok   { color: var(--green); }
    .log .fail { color: var(--red); }
    .log .info { color: var(--orange); }

    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }
    .btn-primary:hover { background: #cc4c00; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-left: 10px;
    }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    .token-preview {
      margin-top: 20px;
      background: rgba(0,229,160,0.04);
      border: 1px solid rgba(0,229,160,0.12);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(0,229,160,0.7);
      word-break: break-all;
      text-align: left;
      max-width: 400px;
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <!-- Estado inicial: cargando -->
  <div class="icon-wrap loading" id="iconWrap">
    <div class="spinner-ring"></div>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF5F00" stroke-width="1.5">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>

  <div class="status-title" id="statusTitle">Procesando autenticación...</div>
  <div class="status-desc" id="statusDesc">Capturando token desde Genesys Cloud. Un momento.</div>

  <div class="log" id="logBox">
    <span class="info">▶</span> Iniciando captura de token OAuth...<br>
  </div>

  <div id="actionButtons" style="display:none;"></div>
  <div id="tokenPreview" style="display:none;" class="token-preview"></div>
</div>

<script>
  // ─── UTILIDADES DE LOG ─────────────────────────────────────────────────────
  const logBox = document.getElementById('logBox');

  function log(msg, type = '') {
    const prefix = type === 'ok' ? '✓' : type === 'fail' ? '✗' : '▶';
    logBox.innerHTML += `<span class="${type}">${prefix}</span> ${msg}<br>`;
  }

  function setStatus(title, desc, state) {
    document.getElementById('statusTitle').textContent = title;
    document.getElementById('statusDesc').textContent  = desc;

    const icon = document.getElementById('iconWrap');
    icon.className = `icon-wrap ${state}`;

    if (state !== 'loading') {
      const ring = icon.querySelector('.spinner-ring');
      if (ring) ring.remove();
    }

    if (state === 'success') {
      icon.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00e5a0" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>`;
    } else if (state === 'error') {
      icon.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff4f4f" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>`;
    }
  }

  // ─── PARSEAR HASH DE URL ───────────────────────────────────────────────────
  // Genesys devuelve: /auth-callback.html#access_token=XXX&token_type=bearer&expires_in=86400&state=YYY
  function parseHashParams() {
    const hash   = window.location.hash.substring(1); // quitar el #
    const params = new URLSearchParams(hash);
    return {
      access_token: params.get('access_token'),
      token_type:   params.get('token_type'),
      expires_in:   params.get('expires_in'),
      state:        params.get('state'),
      error:        params.get('error'),
      error_desc:   params.get('error_description')
    };
  }

  // ─── VALIDAR STATE CSRF ────────────────────────────────────────────────────
  function validateState(returnedState) {
    const savedState = sessionStorage.getItem('gc_oauth_state');
    return savedState && savedState === returnedState;
  }

  // ─── GUARDAR TOKEN SEGURO ──────────────────────────────────────────────────
  function saveSession(token, expiresIn, region, clientId) {
    const expiresAt = Date.now() + (parseInt(expiresIn) * 1000);
    sessionStorage.setItem('gc_access_token', token);
    sessionStorage.setItem('gc_token_expires', expiresAt.toString());
    sessionStorage.setItem('gc_region',        region);
    sessionStorage.setItem('gc_client_id',     clientId);
    sessionStorage.removeItem('gc_oauth_state');
  }

  // ─── VERIFICAR TOKEN CON GENESYS API ──────────────────────────────────────
  async function verifyToken(token, region) {
    log('Verificando token con Genesys API...');
    const res = await fetch(`https://api.${region}/api/v2/users/me`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) throw new Error(`API respondió ${res.status}`);
    return await res.json();
  }

  // ─── FLUJO PRINCIPAL ───────────────────────────────────────────────────────
  async function processCallback() {
    // Pequeño delay visual
    await delay(600);

    const params   = parseHashParams();
    const region   = sessionStorage.getItem('gc_region')    || 'mypurecloud.com';
    const clientId = sessionStorage.getItem('gc_client_id') || '';

    // ── Error retornado por Genesys ──────────────────────────────────────────
    if (params.error) {
      log(`Error de Genesys: ${params.error}`, 'fail');
      log(params.error_desc || 'Acceso denegado.', 'fail');
      setStatus('Autenticación rechazada', params.error_desc || 'Revisa la configuración OAuth en Genesys Cloud.', 'error');
      showRetryButton();
      return;
    }

    // ── Sin token en URL ─────────────────────────────────────────────────────
    if (!params.access_token) {
      // Si ya hay una sesión CC activa (token procesado en index.html), redirigir directo
      const method = sessionStorage.getItem('gc_method');
      if (method === 'credentials' && sessionStorage.getItem('gc_access_token')) {
        log('Sesión Client Credentials ya activa. Redirigiendo...', 'ok');
        setStatus('Sesión activa', 'Token CC ya procesado.', 'success');
        await delay(800);
        window.location.href = 'app.html';
        return;
      }

      log('No se encontró access_token en la URL.', 'fail');
      log('La URL hash está vacía o fue manipulada.', 'fail');
      setStatus('Token no encontrado', 'Regresa al login e intenta de nuevo.', 'error');
      showRetryButton();
      return;
    }

    log('access_token capturado desde URL.', 'ok');

    // ── Validar CSRF State ───────────────────────────────────────────────────
    if (params.state) {
      if (validateState(params.state)) {
        log('State CSRF validado correctamente.', 'ok');
      } else {
        log('State CSRF no coincide. Posible ataque CSRF.', 'fail');
        setStatus('Error de seguridad', 'El parámetro state no coincide. Intenta de nuevo.', 'error');
        showRetryButton();
        return;
      }
    }

    // ── Guardar token ────────────────────────────────────────────────────────
    saveSession(params.access_token, params.expires_in || '86400', region, clientId);
    log(`Token guardado. Expira en ${Math.round((params.expires_in || 86400) / 3600)}h.`, 'ok');

    // ── Limpiar token de la URL (seguridad) ──────────────────────────────────
    history.replaceState(null, '', window.location.pathname);
    log('URL limpiada (token removido del historial).', 'ok');

    // ── Verificar con la API ─────────────────────────────────────────────────
    try {
      const user = await verifyToken(params.access_token, region);
      const name  = user.name  || 'Usuario';
      const email = user.email || '';
      const org   = user.organization?.name || '';

      // Obtener nombre real de la organización (más preciso que user.organization)
      let orgName = org;
      try {
        const orgRes  = await fetch(`https://api.${region}/api/v2/organizations/me`, {
          headers: { 'Authorization': `Bearer ${params.access_token}` }
        });
        const orgData = await orgRes.json();
        orgName = orgData.name || orgData.shortName || org;
        log(`Organización: ${orgName}`, 'ok');
      } catch (_) {
        // Fallback al nombre del usuario si /organizations/me falla
      }

      log(`Sesión activa: ${name} — ${orgName}`, 'ok');

      // Guardar info del usuario
      sessionStorage.setItem('gc_user_name',  name);
      sessionStorage.setItem('gc_user_email', email);
      sessionStorage.setItem('gc_org_name',   orgName);

      setStatus('¡Autenticación exitosa!', `Bienvenido, ${name}. Redirigiendo al panel...`, 'success');

      // Mostrar preview del token (solo primeros/últimos chars)
      showTokenPreview(params.access_token);

      // Redirigir al dashboard
      await delay(1800);
      window.location.href = 'app.html';

    } catch (err) {
      log(`Error verificando token: ${err.message}`, 'fail');
      // El token puede ser válido pero la verificación falló por CORS en local
      // Igualmente redirigimos al app
      log('Redirigiendo de todos modos (posible CORS en localhost)...', 'info');
      setStatus('Token capturado', 'Verificación limitada en localhost. Redirigiendo...', 'success');
      await delay(2000);
      window.location.href = 'app.html';
    }
  }

  // ─── UI HELPERS ────────────────────────────────────────────────────────────
  function showRetryButton() {
    const el = document.getElementById('actionButtons');
    el.style.display = 'block';
    el.innerHTML = `
      <a href="index.html" class="btn btn-primary">← Volver al Login</a>
    `;
  }

  function showTokenPreview(token) {
    const el = document.getElementById('tokenPreview');
    el.style.display = 'block';
    const preview = token.substring(0, 20) + '...' + token.substring(token.length - 10);
    el.innerHTML = `🔐 TOKEN: ${preview}`;
  }

  function delay(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  // ─── ARRANCAR ─────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', processCallback);
</script>
</body>
</html>
